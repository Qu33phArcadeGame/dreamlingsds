name: Build Dreamlings DS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dreamlings.nds
        run: |
          RULES="$BLOCKSDS/sys/default_makefiles/rom_arm9/Makefile"
          printf '%s\n' \
            'NAME          := dreamlings' \
            'GAME_TITLE    := Deepdreamlings DS' \
            'GAME_SUBTITLE := Real neural dreaming' \
            'GAME_AUTHOR   := Coby' \
            'SOURCEDIRS    := source' \
            "include $RULES" > Makefile
          cat Makefile
          make
          ls -la *.nds

      - uses: actions/upload-artifact@v4
        with:
          name: dreamlings-nds
          path: "*.nds"
